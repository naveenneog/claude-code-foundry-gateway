openapi: 3.0.3
info:
  title: AUM service
  version: 1.1.0
  description: |
    Optional Azure Usage Management authority; no Turnstile dependency.
    All paths require a delegated Entra v2 bearer token for this app with
    AUM.Access and AUM.Admin, AUM.Viewer or AUM.Manager. Precedence is
    Admin > Viewer > Manager. Missing/overage groups grant no managed scope.
    Existing budgets are gateway tokens. Additive usd-budgets persist decimal
    dollars and a dated tariff; delayed observed-category enforcement is not
    an invoice or complete streaming-cost guarantee.
    Every mutation requires a reason and is audited. Budget/configuration
    mutations require If-Match with the revision from a fresh GET /budgets.
servers:
  - url: https://func-aum-contoso.azurewebsites.net
security:
  - bearer: []
paths:
  /api/v1/usd-budgets:
    get:
      operationId: usdBudgets
      responses:
        '200':
          description: Scoped USD definitions, currency USD, price_book_date, revision and writable items. Money is decimal text.
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema_version: {type: integer, enum: [1]}
                  currency: {type: string, enum: [USD]}
                  revision: {type: string}
                  price_book_date: {type: string, nullable: true}
                  items: {type: array, items: {$ref: '#/components/schemas/UsdBudget'}}
  /api/v1/usd-budgets/{scope_type}/{scope_id}:
    parameters:
      - {$ref: '#/components/parameters/ScopeType'}
      - {$ref: '#/components/parameters/ScopeId'}
    put:
      operationId: setUsdBudget
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UsdBudgetWrite'}}}
      responses:
        '200': {description: Audited selected-scope result and new revision. Await reconciliation before claiming enforcement.}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Other authority, stale revision, missing installation/book, capacity or insufficient USD headroom.}
    delete:
      operationId: clearUsdBudget
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Reason'}}}
      responses:
        '200': {description: Selected USD control cleared; token controls remain.}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/usd-price-book:
    get:
      operationId: usdPriceBook
      responses:
        '200': {description: The stored price_book and configuration revision; null book until initialized.}
    put:
      operationId: setUsdPriceBook
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, price_book]
              properties:
                reason: {type: string, minLength: 1, maxLength: 500}
                price_book: {$ref: '#/components/schemas/UsdPriceBook'}
      responses:
        '200': {description: Admin-only dated tariff initialized or idempotently retained.}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Active budgets pin their tariff; explicit clearing is required before replacement.}
  /api/v1/usd-budget-status:
    get:
      operationId: usdBudgetStatus
      responses:
        '200':
          description: |
            Scope-filtered expanded decisions, enabled/fresh flags, 300-second
            interval, 900-second state lifetime, reconciled_at/valid_until,
            source_revision/policy_revision and items keyed by scope_type:scope_id.
            Each item has nominal/effective budget_usd, nullable spent_usd,
            UTC period_start/period_end, status allow/notice/stop/unpriced,
            enforcement, exact/cache_read_known/cache_write_known and unpriced_models.
            Exact describes observed category arithmetic, never complete ingestion or invoice accuracy.
  /api/v1/usd-budget-reconcile:
    post:
      operationId: reconcileUsdBudgets
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false}}}
      responses:
        '200': {description: Admin-only on-demand result from the same leased/audited engine as the five-minute timer.}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Another authority/writer or configuration change; no stale snapshot is applied.}
        '503': {description: Telemetry or Azure unavailable; previous snapshot is retained until expiry.}
  /api/v1/me:
    get:
      operationId: me
      responses:
        '200':
          description: Identity and server-resolved scope; null is unrestricted, an empty object is still scoped.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Identity'}
  /api/v1/capabilities:
    get:
      operationId: capabilities
      responses:
        '200':
          description: Versioned feature flags, narrowed to the current caller. Unknown flags must default to false.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Capabilities'}
  /api/v1/usage:
    get:
      operationId: usage
      parameters:
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - {$ref: '#/components/parameters/Organization'}
        - {$ref: '#/components/parameters/Department'}
        - {$ref: '#/components/parameters/User'}
      responses:
        '200':
          description: Aggregated saved ClaudeCost data filtered before aggregation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests: {type: integer}
                  prompt_tokens: {type: number}
                  completion_tokens: {type: number}
                  cache_read_tokens: {type: number}
                  usd: {type: number}
                  cost_is_estimate: {type: boolean, enum: [true]}
                  cache_write_known: {type: boolean, enum: [false]}
                  as_of: {type: string, format: date-time}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/trends:
    get:
      operationId: trends
      parameters:
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - {$ref: '#/components/parameters/Organization'}
        - {$ref: '#/components/parameters/Department'}
      responses:
        '200':
          description: Daily saved ClaudeCost aggregates in items; UTC, maximum 93 days.
          content: {application/json: {schema: {$ref: '#/components/schemas/Page'}}}
  /api/v1/people:
    get:
      operationId: people
      parameters:
        - {name: search, in: query, schema: {type: string, maxLength: 100}}
        - {$ref: '#/components/parameters/Organization'}
        - {$ref: '#/components/parameters/Department'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: |
            Observed people only; saved ClaudeCost, not an Entra directory scan.
            Items carry id, name, parent_id, organization_id, department_id.
            Stable id keyset cursor; scope is revalidated on every page.
          content: {application/json: {schema: {$ref: '#/components/schemas/Page'}}}
  /api/v1/requests:
    get:
      operationId: requests
      parameters:
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - {$ref: '#/components/parameters/Organization'}
        - {$ref: '#/components/parameters/Department'}
        - {$ref: '#/components/parameters/User'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Saved ClaudeChargeback request rows. Unknown cache values remain null.
          content: {application/json: {schema: {$ref: '#/components/schemas/Page'}}}
  /api/v1/budgets:
    get:
      operationId: budgets
      responses:
        '200':
          description: Scoped budgets and opaque configuration revision.
          headers:
            ETag:
              description: Quoted HTTP entity-tag, suitable for If-Match.
              schema: {type: string}
          content:
            application/json:
              schema:
                type: object
                required: [items, revision]
                properties:
                  revision: {type: string}
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Budget'}
  /api/v1/budgets/{scope_type}/{scope_id}:
    parameters:
      - {$ref: '#/components/parameters/ScopeType'}
      - {$ref: '#/components/parameters/ScopeId'}
    put:
      operationId: setBudget
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/BudgetWrite'}}}
      responses:
        '200': {$ref: '#/components/responses/Mutation'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      operationId: clearBudget
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Reason'}}}
      responses:
        '200': {$ref: '#/components/responses/Mutation'}
        '409':
          description: Clearing to an unlimited/default budget would exceed a finite parent.
  /api/v1/catalog:
    get:
      operationId: catalog
      responses:
        '200':
          description: |
            organizations and departments. A team manager's parent organization
            is display context only. Each entity has id, name, parent_id,
            external_ref and attributes (enforcement, allowance_percent).
          content: {application/json: {schema: {type: object}}}
    put:
      operationId: setCatalog
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entities, reason]
              properties:
                entities: {type: array, items: {$ref: '#/components/schemas/Entity'}}
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        '200': {$ref: '#/components/responses/Mutation'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/tiers:
    get:
      operationId: tiers
      responses:
        '200':
          description: standard/premium items with tokens_per_day, tokens_per_minute and models.
          content: {application/json: {schema: {$ref: '#/components/schemas/Page'}}}
  /api/v1/tiers/{tier}:
    parameters:
      - {name: tier, in: path, required: true, schema: {type: string, enum: [standard, premium]}}
    put:
      operationId: setTier
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tokens_per_day, tokens_per_minute, models, reason]
              properties:
                tokens_per_day: {type: integer, minimum: 1}
                tokens_per_minute: {type: integer, minimum: 1}
                models: {type: array, items: {type: string}}
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        '200': {$ref: '#/components/responses/Mutation'}
  /api/v1/modes/{scope_id}:
    parameters: [{$ref: '#/components/parameters/ScopeId'}]
    put:
      operationId: setMode
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enforcement, reason]
              properties:
                enforcement: {type: string, enum: [strict, allowance, notify]}
                allowance_percent: {type: integer, minimum: 1, maximum: 100}
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        '200': {$ref: '#/components/responses/Mutation'}
  /api/v1/manager-groups/{scope_id}:
    parameters: [{$ref: '#/components/parameters/ScopeId'}]
    put:
      operationId: setManagerGroup
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manager_group_id, reason]
              properties:
                manager_group_id: {type: string, format: uuid, nullable: true}
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        '200': {$ref: '#/components/responses/Mutation'}
  /api/v1/budget-requests:
    get:
      operationId: budgetRequests
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Requests made by the caller or actionable by them; Admin sees all, Viewer cannot access workflows.
          content: {application/json: {schema: {$ref: '#/components/schemas/Page'}}}
    post:
      operationId: createBudgetRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/RequestedBudget'}
                - type: object
                  required: [scope_type, scope_id]
                  properties:
                    scope_type: {type: string, enum: [organization, department, user]}
                    scope_id: {type: string}
      responses:
        '201':
          description: Workflow record with id, state=pending, requester, approver_scope, version and UTC creation time.
          content: {application/json: {schema: {type: object}}}
  /api/v1/budget-requests/{id}/{action}:
    post:
      operationId: decideBudgetRequest
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: action, in: path, required: true, schema: {type: string, enum: [approve, reject, escalate]}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/Reason'}
                - type: object
                  required: [version]
                  properties:
                    version: {type: integer, minimum: 1}
                    admin_override:
                      type: boolean
                      default: false
                      description: Explicit Admin-only self-decision override, audited; never bypasses headroom.
      responses:
        '200': {$ref: '#/components/responses/Mutation'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/boosts:
    get:
      operationId: boosts
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Scoped boost records with pending/active/expired/superseded/failed state.
          content: {application/json: {schema: {$ref: '#/components/schemas/Page'}}}
    post:
      operationId: createBoost
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/RequestedBudget'}
                - type: object
                  required: [scope_type, scope_id, expires_at]
                  properties:
                    scope_type: {type: string, enum: [organization, department, user]}
                    scope_id: {type: string}
                    expires_at: {type: string, format: date-time}
      responses:
        '201': {$ref: '#/components/responses/Mutation'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/notifications:
    get:
      operationId: notifications
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Versioned warning facts only. Transport state and recipients are separate; no email delivery is configured.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/NotificationFact'}}
                  next_cursor: {type: string, nullable: true}
  /api/v1/audit:
    get:
      operationId: audit
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Admin-only audit intents and outcomes (who, what, before, after, UTC time).
          content: {application/json: {schema: {$ref: '#/components/schemas/Page'}}}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    From: {name: from, in: query, schema: {type: string, format: date-time}}
    To: {name: to, in: query, schema: {type: string, format: date-time}}
    Organization: {name: organization_id, in: query, schema: {type: string}}
    Department: {name: department_id, in: query, schema: {type: string}}
    User: {name: user_id, in: query, schema: {type: string, format: uuid}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
    Cursor: {name: cursor, in: query, schema: {type: string, maxLength: 2048}}
    ScopeType: {name: scope_type, in: path, required: true, schema: {type: string, enum: [organization, department, user]}}
    ScopeId: {name: scope_id, in: path, required: true, schema: {type: string}}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted HTTP entity-tag from ETag, or the JSON revision wrapped in double quotes.
      schema: {type: string}
  responses:
    Forbidden:
      description: Not in your scope or role; never an empty success response.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Conflict:
      description: Stale revision, insufficient parent headroom, active boost, writer conflict, or named-value capacity.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Mutation:
      description: Audited outcome; includes audit_id, revision and result. Do not retry a write automatically.
      content: {application/json: {schema: {type: object}}}
  schemas:
    UsdAmount:
      type: string
      pattern: '^[0-9]{1,12}(\.[0-9]{1,9})?$'
      description: Exact nonnegative USD decimal text; zero is a zero-dollar limit, not unlimited.
    UsdBudget:
      type: object
      properties:
        scope_type: {type: string, enum: [organization, department, user]}
        scope_id: {type: string}
        amount_usd: {$ref: '#/components/schemas/UsdAmount'}
        period: {type: string, enum: [day, month]}
        price_book_date: {type: string, format: date}
        writable: {type: boolean}
    UsdBudgetWrite:
      type: object
      additionalProperties: false
      required: [amount_usd, period, price_book_date, reason]
      properties:
        amount_usd: {$ref: '#/components/schemas/UsdAmount'}
        period: {type: string, enum: [day, month], description: Units and teams must use month.}
        price_book_date: {type: string, format: date}
        reason: {type: string, minLength: 1, maxLength: 500}
    UsdPriceBook:
      type: object
      required: [date, models]
      properties:
        date: {type: string, format: date}
        source: {type: string}
        models:
          type: object
          additionalProperties:
            type: object
            required: [inputPerM, outputPerM]
            properties:
              inputPerM: {$ref: '#/components/schemas/UsdAmount'}
              outputPerM: {$ref: '#/components/schemas/UsdAmount'}
              cacheReadPerM: {$ref: '#/components/schemas/UsdAmount'}
              cacheWrite5mPerM: {$ref: '#/components/schemas/UsdAmount'}
              cacheWrite1hPerM: {$ref: '#/components/schemas/UsdAmount'}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string}
    Reason:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 500}
    BudgetWrite:
      allOf:
        - {$ref: '#/components/schemas/Reason'}
        - type: object
          required: [token_limit]
          properties:
            token_limit: {type: integer, minimum: 1, maximum: 9223372036854775807}
            warning_threshold_percent: {type: integer, minimum: 1, maximum: 100, default: 80}
    RequestedBudget:
      allOf:
        - {$ref: '#/components/schemas/Reason'}
        - type: object
          required: [token_limit]
          properties:
            token_limit: {type: integer, minimum: 1, maximum: 9223372036854775807}
    Entity:
      type: object
      required: [id, name, parent_id, external_ref]
      properties:
        id: {type: string}
        name: {type: string}
        parent_id: {type: string, nullable: true}
        external_ref: {type: string, description: 'entra-group:<group display name>'}
        attributes: {type: object}
    Budget:
      type: object
      properties:
        scope_type: {type: string, enum: [organization, department, user]}
        scope_id: {type: string}
        token_limit: {type: integer, nullable: true}
        period: {type: string, enum: [month, day]}
        warning_threshold_percent: {type: integer}
        enforcement: {type: string, enum: [strict, allowance, notify]}
        allowance_percent: {type: integer, nullable: true}
        writable: {type: boolean}
    Page:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {type: object}}
        next_cursor: {type: string, nullable: true}
    NotificationFact:
      type: object
      description: |
        Immutable fact, not a delivery job. A changed nominal token limit or
        threshold rearms the warning; an identical restored limit reuses its
        earlier deterministic id. Future delivery resolves current recipients
        and domain policy at send time. No address list is stored here.
      required:
        - schema_version
        - id
        - kind
        - scope_type
        - scope_id
        - period_start_utc
        - period_end_utc
        - threshold_percent
        - observed_usage
        - usage_unit
        - usage_basis
        - effective_limit_version
        - source
        - token_limit
        - occurred_at
      properties:
        schema_version: {type: integer, enum: [1]}
        id: {type: string}
        kind: {type: string, enum: [budget.warning]}
        scope_type: {type: string, enum: [organization, department, user]}
        scope_id: {type: string}
        period: {type: string}
        period_start_utc: {type: string, format: date-time}
        period_end_utc: {type: string, format: date-time, description: Exclusive UTC end of the budget period.}
        threshold_percent: {type: integer, minimum: 1, maximum: 100}
        observed_usage: {type: string, description: Exact nonnegative decimal text, not binary floating point.}
        usage_unit: {type: string, enum: [tokens]}
        usage_basis: {type: string, enum: [prompt_completion_only]}
        effective_limit_version:
          type: string
          description: Stable policy/content fingerprint of scope, nominal limit, threshold, unit and usage basis; not a monotonically increasing revision.
        source: {type: string, enum: [ClaudeCost, ClaudeChargeback]}
        token_limit: {type: integer}
        occurred_at: {type: string, format: date-time}
    Identity:
      type: object
      required: [id, role, access, method, manager_scope]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        email: {type: string}
        role: {type: string, enum: [owner, member]}
        access: {type: string, enum: [admin, viewer, manager]}
        method: {type: string, enum: [entra]}
        session_expires_at: {type: string, format: date-time}
        manager_scope:
          type: object
          nullable: true
          required: [organizations, departments, writable_department_ids]
          properties:
            organizations: {type: array, items: {$ref: '#/components/schemas/Entity'}}
            departments: {type: array, items: {$ref: '#/components/schemas/Entity'}}
            writable_department_ids: {type: array, items: {type: string}}
    Capabilities:
      type: object
      required: [schema_version, backend, capabilities, limits]
      properties:
        schema_version: {type: integer, enum: [1]}
        backend: {type: string, enum: [aum-service]}
        capabilities:
          type: object
          additionalProperties: {type: boolean}
          example:
            usage_read: true
            budgets_read: true
            budget_write: true
            manager_budget_write: true
            catalog_write: true
            tiers_write: true
            modes_write: true
            budget_requests: true
            approvals: true
            approval_admin_override: true
            boosts: true
            notifications: true
            audit_read: true
            email_delivery: false
        limits:
          type: object
          properties:
            page_size: {type: integer, enum: [200]}
            named_value_characters: {type: integer, enum: [4096]}
            analytics_window_days: {type: integer, enum: [93]}
