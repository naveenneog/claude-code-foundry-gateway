[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-usage-management"
version = "0.2.0"
description = "AUM - Azure Usage Management, keyboard-first governance and usage"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "textual>=1,<7", "typer>=0.15,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[project.scripts]
aum = "claude_finops.cli:main"
claude-finops = "claude_finops.cli:legacy_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claude_finops = ["*.tcss", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
